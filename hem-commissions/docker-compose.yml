services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-commissions}
      POSTGRES_USER: ${DATABASE_USER:-commissions}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-commissions}"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media

  # Фоновые задачи: напоминания, эскалации, закрытие голосований, ежемесячная проверка НПА.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py run_scheduler
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
